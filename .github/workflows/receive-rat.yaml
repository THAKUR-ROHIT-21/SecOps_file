name: SecOps Pipeline

on:
  repository_dispatch:
    types:
      - application_push

permissions:
  contents: read
  packages: write

jobs:

  # ============================================================
  # 1. GITLEAKS - SECRET SCANNING
  # ============================================================

  gitleaks:
    name: Gitleaks - Secret Scanning
    runs-on: ubuntu-latest

    steps:

      - name: Display Application Information
        run: |
          echo "============================================"
          echo "GITLEAKS SECRET SCANNING"
          echo "============================================"

          echo "Repository:"
          echo "${{ github.event.client_payload.repository }}"

          echo "Branch:"
          echo "${{ github.event.client_payload.branch }}"

          echo "Commit:"
          echo "${{ github.event.client_payload.commit_sha }}"

      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application

      - name: Verify Checked Out Commit
        run: |
          echo "============================================"
          echo "CHECKED OUT COMMIT"
          echo "============================================"

          git -C application rev-parse HEAD

      - name: Scan Application for Secrets
        run: |
          echo "============================================"
          echo "RUNNING GITLEAKS"
          echo "============================================"

          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source=/repo \
            --no-git \
            --no-banner \
            --report-format json \
            --report-path /repo/gitleaks-report.json \
            --exit-code 1

      - name: Show Gitleaks Findings
        if: always()
        run: |
          echo "============================================"
          echo "GITLEAKS FINDINGS"
          echo "============================================"

          if [ -f "application/gitleaks-report.json" ]; then

            if [ "$(jq 'length' application/gitleaks-report.json)" -gt 0 ]; then

              jq -r '
                .[] |
                "File: \(.File)\nLine: \(.StartLine)\nRule: \(.RuleID)\nCommit: \(.Commit // "N/A")\n---"
              ' application/gitleaks-report.json

            else
              echo "No secrets detected."
            fi

          else
            echo "No Gitleaks report generated."
          fi


  # ============================================================
  # 2. BACKEND - SONARQUBE + BUILD + TRIVY + GHCR
  # ============================================================

  build-scan-push-backend:
    name: Backend - SonarQube + Build + Scan + Push
    runs-on: self-hosted

    needs:
      - gitleaks

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Display Backend Information
        run: |
          echo "============================================"
          echo "BACKEND SECURITY PIPELINE"
          echo "============================================"

          echo "Repository:"
          echo "${{ github.event.client_payload.repository }}"

          echo "Branch:"
          echo "${{ github.event.client_payload.branch }}"

          echo "Commit:"
          echo "${{ github.event.client_payload.commit_sha }}"

      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application
          fetch-depth: 0

      - name: Verify Application Commit
        run: |
          echo "============================================"
          echo "VERIFYING COMMIT"
          echo "============================================"

          ACTUAL_COMMIT=$(git -C application rev-parse HEAD)

          echo "Expected Commit:"
          echo "${{ github.event.client_payload.commit_sha }}"

          echo ""
          echo "Actual Commit:"
          echo "$ACTUAL_COMMIT"

          if [ "$ACTUAL_COMMIT" != "${{ github.event.client_payload.commit_sha }}" ]; then
            echo "ERROR: Commit mismatch!"
            exit 1
          fi

          echo ""
          echo "Commit verification successful."

      - name: Verify Backend Directory
        run: |
          echo "============================================"
          echo "VERIFYING BACKEND"
          echo "============================================"

          if [ ! -d "application/backend" ]; then
            echo "ERROR: application/backend does not exist."
            exit 1
          fi

          echo "Backend directory found."

          echo ""
          echo "Backend files:"
          find application/backend -maxdepth 2 -type f | head -50


      # --------------------------------------------------------
      # SONARQUBE CONNECTIVITY
      # --------------------------------------------------------

      - name: Verify SonarQube Connectivity
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

        run: |
          echo "============================================"
          echo "SONARQUBE CONNECTIVITY CHECK"
          echo "============================================"

          echo "SonarQube URL:"
          echo "$SONAR_HOST_URL"

          echo ""

          curl --fail --silent \
            "$SONAR_HOST_URL/api/system/status"

          echo ""
          echo ""
          echo "SonarQube is reachable."


      # --------------------------------------------------------
      # CLEAN OLD SONAR DATA
      # --------------------------------------------------------

      - name: Clean Previous Sonar Files
        run: |
          echo "============================================"
          echo "CLEANING OLD SONAR DATA"
          echo "============================================"

          rm -rf application/backend/.scannerwork

          echo "Previous .scannerwork directory removed."


      # --------------------------------------------------------
      # SONARQUBE SCAN + QUALITY GATE
      # --------------------------------------------------------

      - name: SonarQube Scan + Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.2.1

        with:

          projectBaseDir: application/backend

          # Self-hosted runner:
          # avoids gpg/dirmngr signature verification requirement
          skipSignatureVerification: true

          args: >
            -Dsonar.projectKey=Hireflow-backend
            "-Dsonar.projectName=Hireflow Backend"
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.verbose=true

        env:

          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


      # --------------------------------------------------------
      # SONARQUBE SUCCESS
      # --------------------------------------------------------

      - name: SonarQube Quality Gate Passed
        run: |
          echo "============================================"
          echo "SONARQUBE QUALITY GATE PASSED"
          echo "============================================"

          echo "Project:"
          echo "Hireflow-backend"

          echo ""
          echo "Dashboard:"
          echo "${{ secrets.SONAR_HOST_URL }}/dashboard?id=Hireflow-backend"

          echo ""
          echo "SonarQube analysis completed successfully."


      # --------------------------------------------------------
      # DOCKER BUILD
      # --------------------------------------------------------

      - name: Build Backend Docker Image
        run: |
          echo "============================================"
          echo "BUILDING BACKEND DOCKER IMAGE"
          echo "============================================"

          docker build \
            -t hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            -f application/backend/Dockerfile \
            application/backend

          echo ""
          echo "Backend Docker image created."


      # --------------------------------------------------------
      # TRIVY IMAGE SCAN
      # --------------------------------------------------------

      - name: Scan Backend Docker Image
        run: |
          echo "============================================"
          echo "TRIVY BACKEND IMAGE SCAN"
          echo "============================================"

          mkdir -p trivy-cache

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            image \
            hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            --severity CRITICAL,HIGH \
            --format table \
            --exit-code 1


      # --------------------------------------------------------
      # TRIVY JSON REPORT
      # --------------------------------------------------------

      - name: Generate Backend Trivy Report
        if: always()
        run: |

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            -v "${GITHUB_WORKSPACE}:/output" \
            aquasec/trivy:latest \
            image \
            hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            --severity CRITICAL,HIGH \
            --format json \
            --output /output/trivy-backend-report.json \
            --exit-code 0


      # --------------------------------------------------------
      # UPLOAD BACKEND TRIVY REPORT
      # --------------------------------------------------------

      - name: Upload Backend Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-image-report
          path: trivy-backend-report.json


      # --------------------------------------------------------
      # LOGIN GHCR
      # --------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # TAG BACKEND IMAGE
      # --------------------------------------------------------

      - name: Tag Backend Image
        run: |

          IMAGE_NAME=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/hireflow-backend

          echo "Image:"
          echo "$IMAGE_NAME"

          docker tag \
            hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            ${IMAGE_NAME}:${{ github.event.client_payload.commit_sha }}

          docker tag \
            hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            ${IMAGE_NAME}:latest


      # --------------------------------------------------------
      # PUSH BACKEND IMAGE
      # --------------------------------------------------------

      - name: Push Backend Image
        run: |

          IMAGE_NAME=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/hireflow-backend

          echo "============================================"
          echo "PUSHING BACKEND IMAGE"
          echo "============================================"

          docker push \
            ${IMAGE_NAME}:${{ github.event.client_payload.commit_sha }}

          docker push \
            ${IMAGE_NAME}:latest

          echo ""
          echo "Backend image pushed successfully."


  # ============================================================
  # 3. FRONTEND - BUILD + TRIVY + GHCR
  # ============================================================

  build-scan-push-frontend:
    name: Frontend - Build + Scan + Push
    runs-on: ubuntu-latest

    needs:
      - gitleaks

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Display Frontend Information
        run: |
          echo "============================================"
          echo "FRONTEND SECURITY PIPELINE"
          echo "============================================"

          echo "Repository:"
          echo "${{ github.event.client_payload.repository }}"

          echo "Commit:"
          echo "${{ github.event.client_payload.commit_sha }}"

      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application

      - name: Verify Application Commit
        run: |
          ACTUAL_COMMIT=$(git -C application rev-parse HEAD)

          echo "Expected:"
          echo "${{ github.event.client_payload.commit_sha }}"

          echo ""
          echo "Actual:"
          echo "$ACTUAL_COMMIT"


      # --------------------------------------------------------
      # VERIFY FRONTEND
      # --------------------------------------------------------

      - name: Verify Frontend Directory
        run: |
          echo "============================================"
          echo "VERIFYING FRONTEND"
          echo "============================================"

          if [ ! -d "application/frontend" ]; then
            echo "ERROR: application/frontend does not exist."
            exit 1
          fi

          echo "Frontend directory found."


      # --------------------------------------------------------
      # BUILD FRONTEND
      # --------------------------------------------------------

      - name: Build Frontend Docker Image
        run: |
          echo "============================================"
          echo "BUILDING FRONTEND DOCKER IMAGE"
          echo "============================================"

          docker build \
            -t hireflow-frontend:${{ github.event.client_payload.commit_sha }} \
            -f application/frontend/Dockerfile \
            --build-arg VITE_API_URL=${{ vars.VITE_API_URL }} \
            application/frontend

          echo ""
          echo "Frontend Docker image created."


      # --------------------------------------------------------
      # TRIVY FRONTEND IMAGE SCAN
      # --------------------------------------------------------

      - name: Scan Frontend Docker Image
        run: |
          echo "============================================"
          echo "TRIVY FRONTEND IMAGE SCAN"
          echo "============================================"

          mkdir -p trivy-cache

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            image \
            hireflow-frontend:${{ github.event.client_payload.commit_sha }} \
            --severity CRITICAL,HIGH \
            --format table \
            --exit-code 1


      # --------------------------------------------------------
      # FRONTEND TRIVY JSON REPORT
      # --------------------------------------------------------

      - name: Generate Frontend Trivy Report
        if: always()
        run: |

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}:/output" \
            aquasec/trivy:latest \
            image \
            hireflow-frontend:${{ github.event.client_payload.commit_sha }} \
            --severity CRITICAL,HIGH \
            --format json \
            --output /output/trivy-frontend-report.json \
            --exit-code 0


      # --------------------------------------------------------
      # UPLOAD FRONTEND REPORT
      # --------------------------------------------------------

      - name: Upload Frontend Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-image-report
          path: trivy-frontend-report.json


      # --------------------------------------------------------
      # LOGIN GHCR
      # --------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # TAG FRONTEND IMAGE
      # --------------------------------------------------------

      - name: Tag Frontend Image
        run: |

          IMAGE_NAME=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/hireflow-frontend

          echo "Image:"
          echo "$IMAGE_NAME"

          docker tag \
            hireflow-frontend:${{ github.event.client_payload.commit_sha }} \
            ${IMAGE_NAME}:${{ github.event.client_payload.commit_sha }}

          docker tag \
            hireflow-frontend:${{ github.event.client_payload.commit_sha }} \
            ${IMAGE_NAME}:latest


      # --------------------------------------------------------
      # PUSH FRONTEND IMAGE
      # --------------------------------------------------------

      - name: Push Frontend Image
        run: |

          IMAGE_NAME=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/hireflow-frontend

          echo "============================================"
          echo "PUSHING FRONTEND IMAGE"
          echo "============================================"

          docker push \
            ${IMAGE_NAME}:${{ github.event.client_payload.commit_sha }}

          docker push \
            ${IMAGE_NAME}:latest

          echo ""
          echo "Frontend image pushed successfully."


  # ============================================================
  # 4. PIPELINE SUCCESS
  # ============================================================

  pipeline-success:
    name: Security & Image Pipeline Completed
    runs-on: ubuntu-latest

    needs:
      - build-scan-push-backend
      - build-scan-push-frontend

    steps:

      - name: Pipeline Completed
        run: |

          echo "============================================"
          echo "SECOPS PIPELINE COMPLETED"
          echo "============================================"

          echo ""
          echo "Gitleaks         : PASSED"
          echo "SonarQube        : PASSED"
          echo "Quality Gate     : PASSED"
          echo "Backend Build    : PASSED"
          echo "Backend Trivy    : PASSED"
          echo "Backend GHCR     : PUSHED"
          echo "Frontend Build   : PASSED"
          echo "Frontend Trivy   : PASSED"
          echo "Frontend GHCR    : PUSHED"

          echo ""
          echo "============================================"
          echo "DOCKER IMAGES"
          echo "============================================"

          echo "ghcr.io/thakur-rohit-21/hireflow-backend:latest"
          echo "ghcr.io/thakur-rohit-21/hireflow-frontend:latest"

          echo ""
          echo "============================================"
          echo "PIPELINE SUCCESS"
          echo "============================================"