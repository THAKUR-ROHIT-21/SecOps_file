name: Step 2 - Receive Application Trigger

on:
  repository_dispatch:
    types:
      - application_push

jobs:
  receive-trigger:
    name: Verify Cross-Repo Communication
    runs-on: ubuntu-latest

    steps:

      - name: Display Received Application Information
        run: |
          echo "============================================"
          echo "SecOps Repository Received Application"
          echo "============================================"

          echo "Application Repository: ${{ github.event.client_payload.repository }}"
          echo "Application Branch: ${{ github.event.client_payload.branch }}"
          echo "Application Commit SHA: ${{ github.event.client_payload.commit_sha }}"

          echo "============================================"


      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application


      - name: Verify Application Checkout
        run: |
          echo "============================================"
          echo "VERIFY APPLICATION CHECKOUT"
          echo "============================================"

          echo "Application Directory:"
          ls -lah "${GITHUB_WORKSPACE}/application"

          echo ""
          echo "Git Commit:"
          git -C "${GITHUB_WORKSPACE}/application" rev-parse HEAD

          echo ""
          echo "Expected Commit:"
          echo "${{ github.event.client_payload.commit_sha }}"

          echo ""
          echo "Application Files:"
          find "${GITHUB_WORKSPACE}/application" \
            -type f \
            -not -path "*/.git/*" \
            | sort

          echo ""
          echo "Total Files:"
          find "${GITHUB_WORKSPACE}/application" \
            -type f \
            -not -path "*/.git/*" \
            | wc -l

          echo "============================================"


      - name: Step 4 - Scan for Application Secrets
        run: |
          echo "============================================"
          echo "STARTING GITLEAKS SECRET SCAN"
          echo "============================================"

          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source=/repo \
            --no-git \
            --no-banner \
            --exit-code 1


      - name: Step 4A - List Scanned Files
        if: always()
        run: |
          echo "============================================"
          echo "FILES INSIDE GITLEAKS SCANNING SCOPE"
          echo "============================================"

          find "${GITHUB_WORKSPACE}/application" \
            -type f \
            -not -path "*/.git/*" \
            | sort

          echo "============================================"