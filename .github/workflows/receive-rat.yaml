name: SecOps Pipeline

on:
  repository_dispatch:
    types:
      - application_push

permissions:
  contents: read
  packages: write

jobs:

  # ==========================================================
  # Stage 1 : SonarQube Code Quality + Quality Gate
  # ==========================================================

  sonarqube-scan:
    name: SonarQube - Code Quality & Quality Gate
    runs-on: self-hosted

    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:

      # --------------------------------------------------------
      # 1. Runner Information
      # --------------------------------------------------------

      - name: Runner Information
        shell: bash
        run: |

          echo "============================================"
          echo "RUNNER INFORMATION"
          echo "============================================"

          echo "Hostname:"
          hostname

          echo ""
          echo "Runner IP:"
          hostname -I || true

          echo ""
          echo "SonarQube URL:"

          if [ -z "$SONAR_HOST_URL" ]; then
            echo "ERROR: SONAR_HOST_URL secret is empty."
            exit 1
          fi

          echo "$SONAR_HOST_URL"


      # --------------------------------------------------------
      # 2. Application Information
      # --------------------------------------------------------

      - name: Display Application Information
        shell: bash
        run: |

          echo "============================================"
          echo "APPLICATION INFORMATION"
          echo "============================================"

          echo "Event:"
          echo "${{ github.event_name }}"

          echo ""
          echo "Repository:"
          echo "${{ github.event.client_payload.repository }}"

          echo ""
          echo "Branch:"
          echo "${{ github.event.client_payload.branch }}"

          echo ""
          echo "Commit SHA:"
          echo "${{ github.event.client_payload.commit_sha }}"


      # --------------------------------------------------------
      # 3. Validate Payload
      # --------------------------------------------------------

      - name: Validate Repository Dispatch Payload
        shell: bash
        run: |

          echo "============================================"
          echo "VALIDATING PAYLOAD"
          echo "============================================"

          if [ -z "${{ github.event.client_payload.repository }}" ]; then
            echo "ERROR: Repository payload is missing."
            exit 1
          fi

          if [ -z "${{ github.event.client_payload.commit_sha }}" ]; then
            echo "ERROR: Commit SHA payload is missing."
            exit 1
          fi

          echo "Repository payload: OK"
          echo "Commit SHA payload: OK"


      # --------------------------------------------------------
      # 4. Checkout Exact Application Commit
      # --------------------------------------------------------

      - name: Checkout Application
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application
          fetch-depth: 0


      # --------------------------------------------------------
      # 5. Verify Application
      # --------------------------------------------------------

      - name: Verify Application Source
        shell: bash
        run: |

          echo "============================================"
          echo "APPLICATION SOURCE"
          echo "============================================"

          echo "Expected Commit:"
          echo "${{ github.event.client_payload.commit_sha }}"

          echo ""
          echo "Actual Commit:"
          git -C application rev-parse HEAD

          ACTUAL_COMMIT=$(git -C application rev-parse HEAD)

          if [ "$ACTUAL_COMMIT" != "${{ github.event.client_payload.commit_sha }}" ]; then
            echo ""
            echo "ERROR: Commit mismatch."
            exit 1
          fi

          echo ""
          echo "Commit verification successful."

          echo ""
          echo "Application Directory:"
          ls -la application

          echo ""
          echo "Backend Directory:"

          if [ ! -d "application/backend" ]; then
            echo "ERROR: application/backend does not exist."
            exit 1
          fi

          ls -la application/backend


      # --------------------------------------------------------
      # 6. Verify SonarQube Secrets
      # --------------------------------------------------------

      - name: Verify SonarQube Configuration
        shell: bash
        run: |

          echo "============================================"
          echo "SONARQUBE CONFIGURATION"
          echo "============================================"

          if [ -z "$SONAR_HOST_URL" ]; then
            echo "ERROR: SONAR_HOST_URL is empty."
            exit 1
          fi

          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: SONAR_TOKEN is empty."
            exit 1
          fi

          echo "SONAR_HOST_URL: CONFIGURED"
          echo "SONAR_TOKEN: CONFIGURED"


      # --------------------------------------------------------
      # 7. Test SonarQube Connectivity
      # --------------------------------------------------------

      - name: Test SonarQube Connectivity
        shell: bash
        run: |

          echo "============================================"
          echo "SONARQUBE CONNECTIVITY"
          echo "============================================"

          echo "Testing SonarQube server..."

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --output /tmp/sonar-status.json \
            --write-out "%{http_code}" \
            "$SONAR_HOST_URL/api/system/status")

          echo ""
          echo "HTTP Status:"
          echo "$HTTP_STATUS"

          echo ""
          echo "SonarQube Response:"
          cat /tmp/sonar-status.json

          echo ""

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Cannot connect to SonarQube."
            exit 1
          fi

          if grep -q '"status":"UP"' /tmp/sonar-status.json; then
            echo ""
            echo "SUCCESS: SONARQUBE IS UP"
          else
            echo ""
            echo "ERROR: SonarQube status is not UP."
            exit 1
          fi


      # --------------------------------------------------------
      # 8. Verify Docker
      # --------------------------------------------------------

      - name: Verify Docker
        shell: bash
        run: |

          echo "============================================"
          echo "DOCKER"
          echo "============================================"

          docker --version

          echo ""

          docker info > /dev/null

          echo "Docker is working."


      # --------------------------------------------------------
      # 9. Pull Sonar Scanner
      # --------------------------------------------------------

      - name: Pull Sonar Scanner Image
        shell: bash
        run: |

          echo "============================================"
          echo "SONAR SCANNER IMAGE"
          echo "============================================"

          docker pull sonarsource/sonar-scanner-cli:latest


      # --------------------------------------------------------
      # 10. Clean Previous Sonar Data
      # --------------------------------------------------------

      - name: Clean Previous Sonar Data
        shell: bash
        run: |

          echo "============================================"
          echo "CLEANING PREVIOUS SONAR DATA"
          echo "============================================"

          rm -rf application/backend/.scannerwork

          echo "Previous .scannerwork directory removed."


      # --------------------------------------------------------
      # 11. SonarQube Scan
      # --------------------------------------------------------

      - name: SonarQube Backend Scan
        shell: bash
        run: |

          echo "============================================"
          echo "SONARQUBE BACKEND SCAN"
          echo "============================================"

          echo "SonarQube Server:"
          echo "$SONAR_HOST_URL"

          echo ""
          echo "Project:"
          echo "Hireflow-backend"

          echo ""
          echo "Starting SonarQube scanner..."

          docker run --rm \
            --network host \
            -v "${GITHUB_WORKSPACE}/application/backend:/usr/src" \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.projectKey=Hireflow-backend \
            -Dsonar.projectName="Hireflow Backend" \
            -Dsonar.sources=/usr/src \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.exclusions="**/node_modules/**,**/dist/**,**/build/**,**/coverage/**" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300 \
            -Dsonar.verbose=true

          echo ""
          echo "SonarQube scanner completed."


      # --------------------------------------------------------
      # 12. Verify SonarQube Report
      # --------------------------------------------------------

      - name: Verify SonarQube Analysis Report
        shell: bash
        run: |

          echo "============================================"
          echo "VERIFYING SONARQUBE ANALYSIS"
          echo "============================================"

          if [ -f "application/backend/.scannerwork/report-task.txt" ]; then

            echo "SonarQube report-task.txt found."

            echo ""
            echo "Report:"
            cat application/backend/.scannerwork/report-task.txt

          else

            echo "WARNING: report-task.txt was not found."

            echo ""
            echo "Listing .scannerwork directory:"

            if [ -d "application/backend/.scannerwork" ]; then
              find application/backend/.scannerwork -maxdepth 2 -type f -print
            else
              echo ".scannerwork directory does not exist."
            fi

          fi


      # --------------------------------------------------------
      # 13. SonarQube Quality Gate Passed
      # --------------------------------------------------------

      - name: SonarQube Quality Gate Passed
        shell: bash
        run: |

          echo "============================================"
          echo "SONARQUBE QUALITY GATE PASSED"
          echo "============================================"

          echo "Project:"
          echo "Hireflow-backend"

          echo ""
          echo "Dashboard:"
          echo "$SONAR_HOST_URL/dashboard?id=Hireflow-backend"

          echo ""
          echo "Quality Gate:"
          echo "PASSED"

          echo ""
          echo "SonarQube analysis completed successfully."


  # ==========================================================
  # Stage 2 : Secret Scanning
  # ==========================================================

  gitleaks:
    name: Gitleaks - Secret Scanning
    runs-on: ubuntu-latest

    needs:
      - sonarqube-scan

    steps:

      - name: Display Received Application Information
        run: |

          echo "============================================"
          echo "GITLEAKS SECRET SCANNING"
          echo "============================================"

          echo "Application Repository:"
          echo "${{ github.event.client_payload.repository }}"

          echo ""
          echo "Application Branch:"
          echo "${{ github.event.client_payload.branch }}"

          echo ""
          echo "Application Commit SHA:"
          echo "${{ github.event.client_payload.commit_sha }}"


      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application


      - name: Verify Checked Out Commit
        run: |

          echo "============================================"
          echo "VERIFYING COMMIT"
          echo "============================================"

          ACTUAL_COMMIT=$(git -C application rev-parse HEAD)

          echo "Expected:"
          echo "${{ github.event.client_payload.commit_sha }}"

          echo ""
          echo "Actual:"
          echo "$ACTUAL_COMMIT"

          if [ "$ACTUAL_COMMIT" != "${{ github.event.client_payload.commit_sha }}" ]; then
            echo "ERROR: Commit mismatch."
            exit 1
          fi

          echo ""
          echo "Commit verification successful."


      - name: Scan for Application Secrets
        run: |

          echo "============================================"
          echo "RUNNING GITLEAKS"
          echo "============================================"

          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source=/repo \
            --no-git \
            --no-banner \
            --report-format json \
            --report-path /repo/gitleaks-report.json \
            --exit-code 1


      - name: Show Detected Secrets
        if: always()
        run: |

          echo "============================================"
          echo "GITLEAKS FINDINGS"
          echo "============================================"

          if [ -f "application/gitleaks-report.json" ]; then

            if [ "$(jq 'length' application/gitleaks-report.json)" -gt 0 ]; then

              jq -r '
                .[] |
                "File: \(.File)\nLine: \(.StartLine)\nRule: \(.RuleID)\nCommit: \(.Commit // "N/A")\n---"
              ' application/gitleaks-report.json

            else

              echo "No secrets detected."

            fi

          else

            echo "No Gitleaks report generated."

          fi


      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: application/gitleaks-report.json
          if-no-files-found: ignore


  # ==========================================================
  # Stage 3 : Dependency Scanning
  # ==========================================================

  trivy-deps:
    name: Trivy - Dependency Scanning
    runs-on: ubuntu-latest

    needs:
      - gitleaks

    steps:

      - name: Display Received Application Information
        run: |

          echo "============================================"
          echo "TRIVY DEPENDENCY SCANNING"
          echo "============================================"

          echo "Application Repository:"
          echo "${{ github.event.client_payload.repository }}"

          echo ""
          echo "Application Branch:"
          echo "${{ github.event.client_payload.branch }}"

          echo ""
          echo "Application Commit SHA:"
          echo "${{ github.event.client_payload.commit_sha }}"


      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application


      - name: Verify Checked Out Commit
        run: |

          ACTUAL_COMMIT=$(git -C application rev-parse HEAD)

          echo "Expected:"
          echo "${{ github.event.client_payload.commit_sha }}"

          echo ""
          echo "Actual:"
          echo "$ACTUAL_COMMIT"

          if [ "$ACTUAL_COMMIT" != "${{ github.event.client_payload.commit_sha }}" ]; then
            echo "ERROR: Commit mismatch."
            exit 1
          fi


      - name: Create Trivy Cache
        run: |

          mkdir -p trivy-cache


      - name: Scan Dependencies for Vulnerabilities
        run: |

          echo "============================================"
          echo "TRIVY FILESYSTEM SCAN"
          echo "============================================"

          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/repo" \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            fs \
            /repo \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --format table \
            --exit-code 1


      - name: Generate JSON Report of Findings
        if: always()
        run: |

          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/repo" \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            fs \
            /repo \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --format json \
            --output /repo/trivy-fs-report.json \
            --exit-code 0


      - name: Show Vulnerability Summary
        if: always()
        run: |

          echo "============================================"
          echo "TRIVY DEPENDENCY FINDINGS"
          echo "============================================"

          if [ -f "application/trivy-fs-report.json" ]; then

            jq -r '
              .Results[]? |
              select(.Vulnerabilities != null) |
              .Vulnerabilities[] |
              "Package: \(.PkgName)\nInstalled: \(.InstalledVersion)\nFixed In: \(.FixedVersion // "N/A")\nSeverity: \(.Severity)\nCVE: \(.VulnerabilityID)\n---"
            ' application/trivy-fs-report.json

          else

            echo "No report file found."

          fi


      - name: Upload Trivy FS Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-dependency-report
          path: application/trivy-fs-report.json
          if-no-files-found: ignore


  # ==========================================================
  # Stage 4 : Backend Build + Trivy + GHCR
  # ==========================================================

  build-scan-push-backend:
    name: Backend - Build, Scan & Push
    runs-on: ubuntu-latest

    needs:
      - trivy-deps

    steps:

      - name: Display Backend Information
        run: |

          echo "============================================"
          echo "BACKEND BUILD PIPELINE"
          echo "============================================"

          echo "Repository:"
          echo "${{ github.event.client_payload.repository }}"

          echo ""
          echo "Commit:"
          echo "${{ github.event.client_payload.commit_sha }}"


      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application


      - name: Verify Checked Out Commit
        run: |

          ACTUAL_COMMIT=$(git -C application rev-parse HEAD)

          echo "Expected:"
          echo "${{ github.event.client_payload.commit_sha }}"

          echo ""
          echo "Actual:"
          echo "$ACTUAL_COMMIT"

          if [ "$ACTUAL_COMMIT" != "${{ github.event.client_payload.commit_sha }}" ]; then
            echo "ERROR: Commit mismatch."
            exit 1
          fi


      - name: Verify Backend Directory
        run: |

          echo "============================================"
          echo "VERIFYING BACKEND"
          echo "============================================"

          if [ ! -d "application/backend" ]; then
            echo "ERROR: application/backend does not exist."
            exit 1
          fi

          echo "Backend directory found."


      - name: Build Backend Docker Image
        run: |

          echo "============================================"
          echo "BUILDING BACKEND IMAGE"
          echo "============================================"

          docker build \
            -t hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            -f application/backend/Dockerfile \
            application/backend

          echo ""
          echo "Backend image created successfully."


      - name: Create Trivy Cache
        run: |

          mkdir -p trivy-cache


      - name: Scan Backend Image for Vulnerabilities
        run: |

          echo "============================================"
          echo "TRIVY BACKEND IMAGE SCAN"
          echo "============================================"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            image \
            hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            --severity CRITICAL,HIGH \
            --format table \
            --exit-code 1


      - name: Generate JSON Report of Backend Image Findings
        if: always()
        run: |

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            -v "${GITHUB_WORKSPACE}:/output" \
            aquasec/trivy:latest \
            image \
            hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            --severity CRITICAL,HIGH \
            --format json \
            --output /output/trivy-backend-report.json \
            --exit-code 0


      - name: Show Backend Vulnerability Summary
        if: always()
        run: |

          echo "============================================"
          echo "BACKEND TRIVY FINDINGS"
          echo "============================================"

          if [ -f "trivy-backend-report.json" ]; then

            jq -r '
              .Results[]? |
              select(.Vulnerabilities != null) |
              .Vulnerabilities[] |
              "Package: \(.PkgName)\nInstalled: \(.InstalledVersion)\nFixed In: \(.FixedVersion // "N/A")\nSeverity: \(.Severity)\nCVE: \(.VulnerabilityID)\n---"
            ' trivy-backend-report.json

          else

            echo "No report found."

          fi


      - name: Upload Backend Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-image-report
          path: trivy-backend-report.json
          if-no-files-found: ignore


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Tag Backend Image
        run: |

          IMAGE_NAME=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/hireflow-backend

          echo "Image:"
          echo "$IMAGE_NAME"

          docker tag \
            hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            ${IMAGE_NAME}:${{ github.event.client_payload.commit_sha }}

          docker tag \
            hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            ${IMAGE_NAME}:latest


      - name: Push Backend Image
        run: |

          IMAGE_NAME=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/hireflow-backend

          echo "============================================"
          echo "PUSHING BACKEND IMAGE"
          echo "============================================"

          docker push \
            ${IMAGE_NAME}:${{ github.event.client_payload.commit_sha }}

          docker push \
            ${IMAGE_NAME}:latest

          echo ""
          echo "Backend image pushed successfully."


  # ==========================================================
  # Stage 5 : Frontend Build + Trivy + GHCR
  # ==========================================================

  build-scan-push-frontend:
    name: Frontend - Build, Scan & Push
    runs-on: ubuntu-latest

    needs:
      - trivy-deps

    steps:

      - name: Display Frontend Information
        run: |

          echo "============================================"
          echo "FRONTEND BUILD PIPELINE"
          echo "============================================"

          echo "Repository:"
          echo "${{ github.event.client_payload.repository }}"

          echo ""
          echo "Commit:"
          echo "${{ github.event.client_payload.commit_sha }}"


      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application


      - name: Verify Checked Out Commit
        run: |

          ACTUAL_COMMIT=$(git -C application rev-parse HEAD)

          echo "Expected:"
          echo "${{ github.event.client_payload.commit_sha }}"

          echo ""
          echo "Actual:"
          echo "$ACTUAL_COMMIT"

          if [ "$ACTUAL_COMMIT" != "${{ github.event.client_payload.commit_sha }}" ]; then
            echo "ERROR: Commit mismatch."
            exit 1
          fi


      - name: Verify Frontend Directory
        run: |

          echo "============================================"
          echo "VERIFYING FRONTEND"
          echo "============================================"

          if [ ! -d "application/frontend" ]; then
            echo "ERROR: application/frontend does not exist."
            exit 1
          fi

          echo "Frontend directory found."


      - name: Build Frontend Docker Image
        run: |

          echo "============================================"
          echo "BUILDING FRONTEND IMAGE"
          echo "============================================"

          docker build \
            -t hireflow-frontend:${{ github.event.client_payload.commit_sha }} \
            -f application/frontend/Dockerfile \
            --build-arg VITE_API_URL=${{ vars.VITE_API_URL }} \
            application/frontend

          echo ""
          echo "Frontend image created successfully."


      - name: Create Trivy Cache
        run: |

          mkdir -p trivy-cache


      - name: Scan Frontend Image for Vulnerabilities
        run: |

          echo "============================================"
          echo "TRIVY FRONTEND IMAGE SCAN"
          echo "============================================"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            image \
            hireflow-frontend:${{ github.event.client_payload.commit_sha }} \
            --severity CRITICAL,HIGH \
            --format table \
            --exit-code 1


      - name: Generate JSON Report of Frontend Image Findings
        if: always()
        run: |

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            -v "${GITHUB_WORKSPACE}:/output" \
            aquasec/trivy:latest \
            image \
            hireflow-frontend:${{ github.event.client_payload.commit_sha }} \
            --severity CRITICAL,HIGH \
            --format json \
            --output /output/trivy-frontend-report.json \
            --exit-code 0


      - name: Show Frontend Vulnerability Summary
        if: always()
        run: |

          echo "============================================"
          echo "FRONTEND TRIVY FINDINGS"
          echo "============================================"

          if [ -f "trivy-frontend-report.json" ]; then

            jq -r '
              .Results[]? |
              select(.Vulnerabilities != null) |
              .Vulnerabilities[] |
              "Package: \(.PkgName)\nInstalled: \(.InstalledVersion)\nFixed In: \(.FixedVersion // "N/A")\nSeverity: \(.Severity)\nCVE: \(.VulnerabilityID)\n---"
            ' trivy-frontend-report.json

          else

            echo "No report found."

          fi


      - name: Upload Frontend Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-image-report
          path: trivy-frontend-report.json
          if-no-files-found: ignore


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Tag Frontend Image
        run: |

          IMAGE_NAME=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/hireflow-frontend

          echo "Image:"
          echo "$IMAGE_NAME"

          docker tag \
            hireflow-frontend:${{ github.event.client_payload.commit_sha }} \
            ${IMAGE_NAME}:${{ github.event.client_payload.commit_sha }}

          docker tag \
            hireflow-frontend:${{ github.event.client_payload.commit_sha }} \
            ${IMAGE_NAME}:latest


      - name: Push Frontend Image
        run: |

          IMAGE_NAME=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/hireflow-frontend

          echo "============================================"
          echo "PUSHING FRONTEND IMAGE"
          echo "============================================"

          docker push \
            ${IMAGE_NAME}:${{ github.event.client_payload.commit_sha }}

          docker push \
            ${IMAGE_NAME}:latest

          echo ""
          echo "Frontend image pushed successfully."


  # ==========================================================
  # Stage 6 : Complete Pipeline
  # ==========================================================

  pipeline-success:
    name: Security & Image Pipeline Completed
    runs-on: ubuntu-latest

    needs:
      - sonarqube-scan
      - gitleaks
      - trivy-deps
      - build-scan-push-backend
      - build-scan-push-frontend

    steps:

      - name: Pipeline Completed
        run: |

          echo "===================================================="
          echo "              SECOPS PIPELINE COMPLETED"
          echo "===================================================="

          echo ""
